name: Destroy infrastructure
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY-practica4-todo to delete only this lab application and RDS data
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false
env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: 'true'
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_public_key: unused-for-destroy
jobs:
  destroy:
    if: inputs.confirmation == 'DESTROY-practica4-todo'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
          terraform_wrapper: false
      - name: Initialize existing remote state
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="key=practica4/terraform.tfstate" -backend-config="region=$AWS_DEFAULT_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform -chdir=terraform plan -destroy -input=false -out=destroy.tfplan
      - run: terraform -chdir=terraform apply -auto-approve -input=false destroy.tfplan
      - name: Verify empty application state
        run: |
          test -z "$(terraform -chdir=terraform state list)"
          echo 'Application resources destroyed. Versioned S3 state bucket intentionally retained.' >> "$GITHUB_STEP_SUMMARY"
