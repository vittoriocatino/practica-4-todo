name: Provision infrastructure
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false
env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: 'true'
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_repository_url: https://github.com/${{ github.repository }}.git
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
          terraform_wrapper: false
      - name: Bootstrap encrypted state bucket using Terraform
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET"
          CREATE_BUCKET=true
          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            CREATE_BUCKET=false
            if aws s3api head-object --bucket "$STATE_BUCKET" --key bootstrap/terraform.tfstate >/dev/null 2>&1; then
              aws s3 cp "s3://$STATE_BUCKET/bootstrap/terraform.tfstate" terraform/bootstrap/terraform.tfstate --only-show-errors
            fi
          fi
          terraform -chdir=terraform/bootstrap init -input=false
          terraform -chdir=terraform/bootstrap apply -auto-approve -input=false -var="aws_region=$AWS_DEFAULT_REGION" -var="state_bucket=$STATE_BUCKET" -var="create_state_bucket=$CREATE_BUCKET"
          aws s3 cp terraform/bootstrap/terraform.tfstate "s3://$STATE_BUCKET/bootstrap/terraform.tfstate" --only-show-errors
      - name: Generate unused public key for Terraform Key Pair
        run: |
          if aws ec2 describe-key-pairs --key-names practica4-todo-key --include-public-key --query 'KeyPairs[0].PublicKey' --output text > "$RUNNER_TEMP/todo-key.pub" 2>/dev/null; then
            test -s "$RUNNER_TEMP/todo-key.pub"
          else
            ssh-keygen -t ed25519 -N '' -f "$RUNNER_TEMP/todo-key"
          fi
          echo "TF_VAR_public_key=$(cat "$RUNNER_TEMP/todo-key.pub")" >> "$GITHUB_ENV"
      - name: Initialize S3 remote backend
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="key=practica4/terraform.tfstate" -backend-config="region=$AWS_DEFAULT_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform -chdir=terraform fmt -recursive
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform plan -input=false -out=infra.tfplan
      - run: terraform -chdir=terraform apply -input=false -auto-approve infra.tfplan
      - name: Verify cloud API and record non-secret outputs
        run: |
          mkdir -p evidence
          terraform -chdir=terraform output -json > evidence/terraform-outputs.json
          API_URL=$(terraform -chdir=terraform output -raw api_url)
          python scripts/smoke.py "$API_URL" --wait 900
          echo "API: $API_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "State: s3://${{ vars.TF_STATE_BUCKET }}/practica4/terraform.tfstate" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: infrastructure-outputs
          path: evidence/terraform-outputs.json
