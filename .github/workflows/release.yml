name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  actions: write
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate semantic tag and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Package exact tagged commit and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --output=todo-list.zip HEAD
          sha256sum todo-list.zip > todo-list.zip.sha256
          gh release create "$TAG" todo-list.zip todo-list.zip.sha256 --verify-tag --title "To-Do List $TAG" --generate-notes
      - name: Dispatch deployment after release publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run deploy.yml --ref main -f tag="$TAG"
